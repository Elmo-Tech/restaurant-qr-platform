<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>تخصيص المنتج — موبايل</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Lalezar&amp;display=swap">
<style>
body{margin:0}
a{color:#F5A524}a:hover{color:#FFC35C}
.t-dark{--bg:#12100E;--surface:#1D1A17;--surface2:#29241F;--line:#352F29;--text:#F6EFE5;--text2:#BCB1A2;--text3:#958A7C;--accent:#F5A524;--onaccent:#1C1205;--accentsoft:rgba(245,165,36,.13);--price:#F7B548}
.t-light{--bg:#FBF6EE;--surface:#FFFFFF;--surface2:#F4EBDD;--line:#E9DDCB;--text:#1F1611;--text2:#66584A;--text3:#8B7D6D;--accent:#F5A524;--onaccent:#1C1205;--accentsoft:#FDF0D6;--price:#A9580A}
.gs *{box-sizing:border-box}
.gs button,.gs textarea{font-family:inherit}
.gs button{cursor:pointer}
.ttl{font-family:'Lalezar','IBM Plex Sans Arabic',sans-serif;font-weight:400}
.lat{font-family:'Archivo',sans-serif}
.photo{width:100%;height:100%;object-fit:cover;display:block}
.price{font-family:'Archivo',sans-serif;font-weight:800;color:var(--price);font-variation-settings:'wdth' 88;white-space:nowrap}
.cur{font-family:'IBM Plex Sans Arabic',sans-serif;font-size:.62em;font-weight:600;margin-inline-start:3px}
.gh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.gt{font-size:16.5px;font-weight:700}
.gsub{font-size:12.5px;color:var(--text3);margin-top:2px}
.req{padding:4px 11px;border-radius:999px;background:var(--accentsoft);border:1px solid var(--accent);color:var(--accent);font-size:11.5px;font-weight:700}
.opt-tag{padding:4px 11px;border-radius:999px;border:1px solid var(--line);color:var(--text3);font-size:11.5px;font-weight:700}
.opt{display:flex;align-items:center;gap:12px;min-height:54px;padding:0 14px;margin-bottom:8px;border-radius:16px;background:var(--surface2);border:1.5px solid transparent;font-size:15px;color:var(--text)}
.opt-on{border-color:var(--accent);background:var(--accentsoft);font-weight:700}
.opt-n{flex:1}
.opt-p{font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;color:var(--text2)}
.opt-on .opt-p{color:var(--price)}
.rd{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--text3)}
.rd-on{width:22px;height:22px;flex:none;border-radius:50%;border:6px solid var(--accent);background:var(--onaccent)}
.ck{width:22px;height:22px;flex:none;border-radius:7px;border:2px solid var(--text3)}
.ck-on{width:22px;height:22px;flex:none;border-radius:7px;background:var(--accent);color:var(--onaccent);display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div class="gs {{themeClass}}" dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0B0A09; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif">

<div style="position: absolute; inset: 0; opacity: .35"><img class="photo" src="/_blob/31d6da681ddb8629a3265e1356e08f7d" alt=""></div>
<div style="position: absolute; inset: 0; background: rgba(8,7,6,.6)"></div>

<div role="dialog" aria-modal="true" aria-label="برجر لحم كلاسيك" style="position: absolute; left: 0; right: 0; bottom: 0; height: 806px; background: var(--bg); color: var(--text); border-radius: 30px 30px 0 0; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0,0,0,.5)">

<div style="position: relative; height: 230px; flex: none">
<img class="photo" src="/_blob/e90dfd79edf3b7695aed34105a7fd44b" alt="برجر لحم كلاسيك">
<div style="position: absolute; inset: 0; background: linear-gradient(to top, rgba(12,10,8,.85) 0%, rgba(12,10,8,0) 55%)"></div>
<div style="position: absolute; top: 10px; left: 50%; width: 44px; height: 5px; margin-left: -22px; border-radius: 3px; background: rgba(255,255,255,.75)"></div>
<button type="button" aria-label="إغلاق" style="position: absolute; top: 18px; inset-inline-end: 16px; width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); background: rgba(18,16,14,.55); color: #FFFFFF; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(8px)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
<span style="position: absolute; top: 20px; inset-inline-start: 16px; display: flex; align-items: center; gap: 5px; padding: 5px 11px; border-radius: 999px; background: #F5A524; color: #1C1205; font-size: 12px; font-weight: 700"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 17l-5.4 2.8 1.1-6.1-4.5-4.3 6.1-.8Z"></path></svg>مميز</span>
<div style="position: absolute; bottom: 14px; inset-inline: 20px; display: flex; justify-content: space-between; align-items: flex-end; color: #FFFFFF">
<h2 class="ttl" style="margin: 0; font-size: 30px; line-height: 1.15">برجر لحم كلاسيك</h2>
<span class="lat" style="font-size: 24px; font-weight: 900; color: #F7B548">145<span style="font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 13px; font-weight: 600; margin-inline-start: 3px">ج.م</span></span>
</div>
</div>

<div style="flex: 1; overflow: hidden; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0; font-size: 14px; line-height: 1.75; color: var(--text2)">لحم أنجوس مشوي على اللهب مع شيدر ذائب ومخلل وخس وصوص البيت في خبز بريوش محمص.</p>

<div>
<div class="gh"><div><div class="gt">حجم القطعة</div><div class="gsub">اختر واحد</div></div><span class="req">مطلوب</span></div>
<div class="opt opt-on"><span class="rd-on"></span><span class="opt-n">سينجل (150 جم)</span><span class="opt-p">مشمول</span></div>
<div class="opt"><span class="rd"></span><span class="opt-n">دبل (300 جم)</span><span class="opt-p">+45 ج.م</span></div>
</div>

<div>
<div class="gh"><div><div class="gt">إضافات</div><div class="gsub">حتى 3 · اخترت 1</div></div><span class="opt-tag">اختياري</span></div>
<div class="opt opt-on"><span class="ck-on"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4.5 4.5L19 7"></path></svg></span><span class="opt-n">شيدر إضافي</span><span class="opt-p">+15 ج.م</span></div>
<div class="opt"><span class="ck"></span><span class="opt-n">بيكون بقري مقرمش</span><span class="opt-p">+25 ج.م</span></div>
<div class="opt"><span class="ck"></span><span class="opt-n">مشروم سوتيه</span><span class="opt-p">+20 ج.م</span></div>
</div>

<div>
<label for="note" class="gt" style="display: block; margin-bottom: 8px">ملاحظة للمطبخ <span style="font-weight: 500; font-size: 12.5px; color: var(--text3)">(اختياري)</span></label>
<textarea id="note" rows="2" placeholder="مثلاً: بدون بصل، الصوص على الجنب" style="width: 100%; border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; font-size: 14px; resize: none; background: var(--surface); color: var(--text)"></textarea>
</div>
</div>

<div style="flex: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px 22px; border-top: 1px solid var(--line); background: var(--surface)">
<div style="display: flex; align-items: center; height: 54px; border-radius: 18px; background: var(--surface2); padding: 0 4px">
<button type="button" aria-label="زيادة الكمية" style="width: 44px; height: 46px; border: 0; background: none; color: var(--text); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></button>
<span class="lat" style="min-width: 20px; text-align: center; font-weight: 800; font-size: 17px">1</span>
<button type="button" aria-label="تقليل الكمية" style="width: 44px; height: 46px; border: 0; background: none; color: var(--text3); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"></path></svg></button>
</div>
<button type="button" style="flex: 1; height: 54px; border: 0; border-radius: 18px; background: #F5A524; color: #1C1205; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; font-size: 16px; font-weight: 800; box-shadow: 0 10px 24px rgba(245,165,36,.32)">
<span style="display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>أضف إلى طلبي</span>
<span><span class="lat" style="font-size: 19px; font-weight: 900">160</span><span style="font-size: 12px; margin-inline-start: 3px">ج.م</span></span>
</button>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme || 'dark';
    return { themeClass: theme === 'light' ? 't-light' : 't-dark' };
  }
}
</script>
</body>
</html>
