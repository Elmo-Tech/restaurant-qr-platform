name: Platform Food Image Library - Safe Feature QA

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/prisma/**'
      - 'apps/api/src/platform/**'
      - 'apps/api/scripts/seed-food-tags.ts'
      - 'apps/platform/**'
      - 'docs/01-domain/PLATFORM_FOOD_IMAGE_LIBRARY_SPEC.md'
      - 'apps/api/package.json'
      - '.github/workflows/platform-food-image-library.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: wayta_library_ci
          POSTGRES_PASSWORD: library_ci_only
          POSTGRES_DB: wayta_library_scratch
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U wayta_library_ci -d wayta_library_scratch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://wayta_library_ci:library_ci_only@127.0.0.1:5432/wayta_library_scratch?schema=public
      CORS_ORIGIN: http://localhost:3000
      PLATFORM_ORIGIN: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_API_BASE_PATH: /api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run db:generate
      - name: Apply forward-only migration chain to disposable PostgreSQL 18
        run: npm exec --workspace=apps/api -- prisma migrate deploy
      - name: Validate large trilingual seed without writing
        run: npm run seed:food-tags --workspace=apps/api
      - name: Seed twice (idempotence) on temporary database
        run: |
          npm run seed:food-tags --workspace=apps/api -- --apply
          npm run seed:food-tags --workspace=apps/api -- --apply
      - name: Assert persisted seed counts and no repeated aliases
        run: |
          node <<'NODE'
          const { Client } = require('pg');
          (async () => {
            const db = new Client({ connectionString: process.env.DATABASE_URL });
            await db.connect();
            const sql = 'SELECT (SELECT count(*) FROM food_tags)::int AS tags, (SELECT count(*) FROM food_tag_aliases)::int AS aliases, (SELECT count(*) FROM food_tag_relations)::int AS relations';
            const { rows } = await db.query(sql);
            const r = rows[0];
            if (r.tags < 350 || r.aliases < 1200 || r.relations < 70) {
              throw new Error('Trilingual seed incomplete: ' + JSON.stringify(r));
            }
            console.log('PASS: seed counts ' + JSON.stringify(r));
            await db.end();
          })().catch(e => { console.error(e); process.exitCode = 1; });
          NODE
      - name: Unit tests for matching, multi-sector safety, review and publication
        run: npm exec --workspace=apps/api -- jest --runInBand food-tag-matcher.spec.ts food-library.service.spec.ts
      - name: Backend TypeScript
        run: npm run typecheck --workspace=apps/api
      - name: Platform Console TypeScript
        run: npm run typecheck --workspace=apps/platform
      - name: Lint Platform Console
        run: npm run lint --workspace=apps/platform
      - name: Lint new Backend module
        run: npm exec --workspace=apps/api -- eslint 'src/platform/food-library/**/*.ts'
