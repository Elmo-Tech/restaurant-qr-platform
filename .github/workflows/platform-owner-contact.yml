name: Platform Owner Contact Checks

on:
  push:
    branches: [feat/platform-restaurant-owner-contacts]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Validate Prisma schema without database connection
        run: npm run db:validate
      - name: Typecheck API
        run: npm run typecheck:api
      - name: Test private contact, acquisition and provisioning
        run: npm exec --workspace=apps/api -- jest --runInBand restaurant-owner-contact.spec.ts restaurant-acquisition.spec.ts provision-restaurant.spec.ts
      - name: Typecheck Platform Console
        run: npm run typecheck:platform
      - name: Lint changed Backend and Platform files
        run: |
          npm exec --workspace=apps/api -- eslint --rule 'prettier/prettier: off'             src/platform/restaurant-owner-contact.ts             src/platform/restaurant-owner-contact.spec.ts             src/platform/dto/create-restaurant.dto.ts             src/platform/platform-restaurant-creation.service.ts             src/platform/platform-restaurants.service.ts             src/platform/platform.controller.ts             src/provisioning/provision-restaurant.ts             src/provisioning/provision-restaurant.spec.ts
          npm exec --workspace=apps/platform -- eslint --rule 'prettier/prettier: off'             src/lib/api/platform.ts src/lib/i18n/messages.ts             'src/app/(console)/restaurants/new/NewRestaurantForm.tsx'             'src/app/(console)/restaurants/[restaurantId]/OwnerContactCard.tsx'             'src/app/(console)/restaurants/[restaurantId]/RestaurantDetailView.tsx'             'src/app/(console)/restaurants/RestaurantsView.tsx'
      - name: Check new validation modules formatting
        run: npm exec --workspace=apps/api -- prettier --check src/platform/restaurant-owner-contact.ts src/platform/restaurant-owner-contact.spec.ts
