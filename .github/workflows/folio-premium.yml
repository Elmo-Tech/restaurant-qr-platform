name: FOLIO Premium Checks
on:
  push:
    branches: [feat/folio-premium-template]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run typecheck:api
      - run: npm run typecheck:web
      - run: npm run typecheck:platform
      - run: npm run test --workspace=apps/api -- --runInBand folio-template-config.spec.ts folio-template-config.service.spec.ts templates.spec.ts
      - run: node --test apps/web/src/lib/public-menu/folio-contract.test.mjs
