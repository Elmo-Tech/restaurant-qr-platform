name: Temporary Food Library Formatter
on:
  push:
    branches: [feat/platform-food-image-library]
    paths:
      - '.github/workflows/tmp-food-library-formatter.yml'
permissions:
  contents: write
jobs:
  format:
    if: github.ref == 'refs/heads/feat/platform-food-image-library'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/platform-food-image-library
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format only Food Library backend sources
        run: >-
          npm exec --workspace=apps/api -- prettier --write
          "src/platform/food-library/**/*.ts"
          "scripts/seed-food-tags.ts"
          "src/platform/platform.module.ts"
          "src/platform/platform-audit.service.ts"
      - name: Commit formatting to feature branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/api/src/platform/food-library apps/api/scripts/seed-food-tags.ts apps/api/src/platform/platform.module.ts apps/api/src/platform/platform-audit.service.ts
          if git diff --cached --quiet; then
            echo 'Files already formatted'
          else
            git commit -m 'style(food-tags): format editor backend according to repository rules'
            git push origin HEAD:feat/platform-food-image-library
          fi
