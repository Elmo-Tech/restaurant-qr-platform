name: Wayta Production - Approve and Deploy (no server builds)

on:
  workflow_dispatch:
    inputs:
      backup_and_capacity_checked:
        description: 'I checked backups, pending migrations and free disk on production (aim >=20 GiB).'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  actions: read
  packages: read

# Never cancel a running production deployment.
concurrency:
  group: wayta-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.backup_and_capacity_checked == true
    name: Verify exact main image build and deploy existing Coolify application
    runs-on: ubuntu-latest
    environment: wayta-production
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify release safeguards in isolation
        run: node --test tests/release/deploy-coolify-production.test.mjs
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR for image inspection only
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Require five production images with exact full main SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          for image in api-tools api web platform gateway; do
            docker buildx imagetools inspect "ghcr.io/elmo-tech/restaurant-qr-platform-${image}:prod-${GITHUB_SHA}" > /dev/null
            echo "Verified GHCR image: ${image}"
          done
      - name: Promote SHA, deploy once, check public HTTPS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAYTA_COOLIFY_API_TOKEN: ${{ secrets.WAYTA_COOLIFY_API_TOKEN }}
        run: node scripts/release/deploy-coolify-production.mjs
