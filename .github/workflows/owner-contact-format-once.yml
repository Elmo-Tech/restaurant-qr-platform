name: One-time Owner Contact Formatting

on:
  push:
    branches: [feat/platform-restaurant-owner-contacts]

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message == 'ci(platform): run owner contact formatter' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Format new owner-contact validation and tests only
        run: npm exec --workspace=apps/api -- prettier --write src/platform/restaurant-owner-contact.ts src/platform/restaurant-owner-contact.spec.ts
      - name: Verify changes
        run: git diff --check
      - name: Commit formatting to feature branch (not main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/platform/restaurant-owner-contact.ts apps/api/src/platform/restaurant-owner-contact.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(platform): format owner contact validation"
            git push origin "HEAD:refs/heads/feat/platform-restaurant-owner-contacts"
          fi
