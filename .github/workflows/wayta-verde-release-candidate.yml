name: Wayta VERDE Release Candidate QA

on:
  push:
    branches:
      - integration/wayta-verde-release-candidate-2026-11-02
      - development
  pull_request:
    branches: [main, development]
    paths:
      - 'apps/**'
      - 'docs/03-ui-ux/WAYTA_VERDE_RELEASE_CANDIDATE_2026-11-02.md'
      - '.github/workflows/wayta-verde-release-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-code-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Node 24 with locked npm cache
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate Prisma schema (read-only)
        run: npm run db:validate
      - name: Typecheck API
        run: npm run typecheck:api
      - name: Typecheck Staff + Guest Web
        run: npm run typecheck:web
      - name: Verify tenant SEO, share preview and SSR Host protection
        run: node --test apps/web/src/lib/public-menu/restaurant-seo.contract.test.mjs
      - name: Smoke test Next.js tenant share-card and crawler routes
        run: node tests/release/restaurant-seo-runtime-smoke.mjs
      - name: Verify WhatsApp guest handoff transport regression
        run: node --test apps/web/src/lib/public-menu/whatsapp-handoff.contract.test.mjs
      - name: Typecheck Platform Console
        run: npm run typecheck:platform
      - name: Targeted tenant isolation, guest menu, provisioning, acquisition and menu tests
        run: >-
          npm exec --workspace=apps/api -- jest --runInBand
          restaurant-owner-contact.spec.ts
          restaurant-acquisition.spec.ts
          provision-restaurant.spec.ts
          platform-exclusive-design.spec.ts
          menus-start-fresh.spec.ts
          menus.service.spec.ts
          menus.controller.spec.ts
          public-menu.service.spec.ts
          public-menu.controller.spec.ts
          menu-import-locales.spec.ts
          menu-import-sheet.spec.ts
          menu-import-extraction.spec.ts
      - name: Test temporary demo tenant restrictions, template and safe purge
        run: >-
          npm exec --workspace=apps/api -- jest --runInBand
          demo-purge.spec.ts
          demo-restrictions.spec.ts
          demo-template.spec.ts
      - name: Focused changed Backend semantic lint
        run: >-
          npm exec --workspace=apps/api -- eslint
          --rule 'prettier/prettier: off'
          src/platform/restaurant-owner-contact.ts
          src/platform/restaurant-owner-contact.spec.ts
          src/platform/restaurant-acquisition.ts
          src/platform/restaurant-acquisition.spec.ts
          src/platform/dto/create-restaurant.dto.ts
          src/platform/dto/exclusive-design.dto.ts
          src/menu-import/menu-import-locales.ts
          src/menu-import/menu-import-locales.spec.ts
      - name: Lint temporary demo API modules
        run: >-
          npm exec --workspace=apps/api -- eslint
          --rule 'prettier/prettier: off'
          src/demo/*.ts
          src/platform/dto/platform-demo.dto.ts
          src/platform/platform-demo.controller.ts
      - name: Verify signed WhatsApp receipt and Evolution filtering regressions
        run: >-
          npm exec --workspace=apps/api -- jest --runInBand
          signed-whatsapp-reference.spec.ts
          whatsapp-tracking.service.spec.ts
          whatsapp-order-message.spec.ts
          public-orders.controller.spec.ts
      - name: Lint WhatsApp integration API modules
        run: >-
          npm exec --workspace=apps/api -- eslint
          --rule 'prettier/prettier: off'
          src/whatsapp-tracking/*.ts
          src/public/public-orders.controller.ts
      - name: Check commit whitespace
        run: git diff --check HEAD~1 HEAD
