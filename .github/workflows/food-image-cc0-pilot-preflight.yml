name: Food Photo CC0 Pilot Preflight (No Server Writes)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/food-image-cc0-pilot-preflight.yml'
      - 'docs/01-domain/food-image-cc0-premium-pilot-candidates.json'
      - 'scripts/ops/food-image-cc0-pilot-preview.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install review dependencies
        run: python -m pip install --disable-pip-version-check pillow requests
      - name: Download two rights-reviewed CC0 candidates and create preview package
        run: |
          python scripts/ops/food-image-cc0-pilot-preview.py \
            docs/01-domain/food-image-cc0-premium-pilot-candidates.json \
            cc0-photo-pilot-review
      - name: Keep the photo preview bundle for manual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayta-cc0-premium-photo-pilot-review
          path: cc0-photo-pilot-review/
          retention-days: 14
          if-no-files-found: warn
