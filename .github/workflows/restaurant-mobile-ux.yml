name: Restaurant Mobile UX Checks

on:
  push:
    branches:
      - feat/restaurant-mobile-ux
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-ux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify mobile navigation and entitlement combinations
        run: node --experimental-strip-types --test apps/web/src/lib/staff/mobile-navigation.test.mjs
      - name: Check responsive UX integration
        run: node --test apps/web/src/lib/staff/mobile-navigation.contract.test.mjs
      - name: Verify dev session doctor script
        run: node --check scripts/dev-session-doctor.mjs
      - name: Typecheck web
        run: npm run typecheck:web
      # The pre-existing full-repo lint has errors in GuestHeroBloom,
      # GuestHeroEmber and EditorialPriceDisplayEditor, unrelated to this branch.
      # Keep all modified mobile shell files strictly clean without changing them.
      - name: Lint changed restaurant mobile UI
        run: >-
          npm exec --workspace=apps/web -- eslint
          src/components/staff/MobileNavigation.tsx
          src/components/staff/StaffShell.tsx
          src/components/staff/StaffTopbar.tsx
          src/components/staff/RestaurantSidebar.tsx
          src/lib/staff/mobile-navigation.ts
          src/lib/i18n/messages/common.ts
