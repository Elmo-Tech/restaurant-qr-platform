name: Editorial Variant Price Display Checks
on:
  push:
    branches: [feat/editorial-variant-price-display]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - run: npm run typecheck:api
      - run: npm run typecheck:web
      - run: npm run typecheck:platform
      - run: node --test apps/web/src/lib/public-menu/editorial-price-display.contract.test.mjs
      - run: node --test apps/web/src/lib/public-menu/brew-contract.test.mjs
      - run: npm run test --workspace=apps/api -- --runInBand editorial-template-config.spec.ts templates.spec.ts
